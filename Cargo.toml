[workspace]
resolver = "2"
members = [
    "crates/esphome-api-server",
    "crates/heatingrod",
    "tools/dac-safe",
]
# Vendored crate with local patches (not a workspace member)
exclude = ["vendor/esphome-native-api"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# ESPHome Native API protocol implementation (low-level EspHomeApi layer only;
# the EspHomeServer abstraction of this crate is not usable, see plan/).
# Vendored copy of 3.0.0 with local patches — see plan/CRATE-PATCHES.md.
esphome-native-api = { path = "vendor/esphome-native-api" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
md-5 = "0.10"
hex = "0.4"

[profile.release]
lto = true
opt-level = "z"
strip = true
panic = "abort"
codegen-units = 1
